<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>RW-Template</title>
  <style>
    /* the path draws itself from the start node, then the heading arrow pops in */
    .trace { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.8s cubic-bezier(.65, 0, .35, 1) .3s forwards; }
    .head  { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop .35s ease-out 2.05s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pop  { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      .trace { animation: none; stroke-dashoffset: 0; }
      .head  { animation: none; opacity: 1; }
    }
  </style>
  <defs>
    <!-- slightly lifted from pure black so the badge separates from GitHub's dark theme -->
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2026"/>
      <stop offset="1" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="chrome" gradientUnits="userSpaceOnUse" x1="80" y1="420" x2="480" y2="90">
      <stop offset="0" stop-color="#8b9099"/>
      <stop offset="0.6" stop-color="#d9dadd"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.5" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feComponentTransfer in="b" result="s"><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="redglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feComponentTransfer in="b" result="s"><feFuncA type="linear" slope="0.7"/></feComponentTransfer>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- badge -->
  <rect width="512" height="512" rx="112" fill="url(#plate)"/>
  <rect width="512" height="512" rx="112" fill="url(#grid)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

  <!-- one-stroke cursive "RW": start node -> R -> W -> heading arrow -->
  <!-- mark scaled 92% about the center so it fits inside a circular avatar crop -->
  <g transform="translate(256 256) scale(0.92) translate(-256 -256)">
  <g transform="translate(-14 10)">
    <path class="trace" pathLength="1" filter="url(#glow)" fill="none" stroke="url(#chrome)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"
          d="M96 404 C96 300 100 180 108 128 C112 100 150 100 190 104 C250 110 262 200 200 236 C168 250 136 252 112 256 C160 272 210 330 238 392 C246 410 262 410 270 390 C282 330 296 214 312 206 C330 198 338 320 350 380 C358 410 376 410 386 390 C404 340 424 230 444 140"/>
    <path class="head" filter="url(#redglow)" fill="#ef4444" stroke="#ef4444" stroke-width="10" stroke-linejoin="round"
          d="M456.2 85.3 L479.1 147.8 L408.9 132.2 Z"/>
    <circle cx="96" cy="404" r="15" fill="#16181d" stroke="#8b9099" stroke-width="8"/>
  </g>
  </g>
</svg>
